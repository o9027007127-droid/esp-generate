<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">

  <!-- Outer border double line -->
  <circle cx="500" cy="500" r="480" fill="none" stroke="#d4af37" stroke-width="18"/>
  <circle cx="500" cy="500" r="455" fill="#004c4c" stroke="#d4af37" stroke-width="8"/>

  <!-- 786 on top -->
  <text x="500" y="150" font-size="90" text-anchor="middle" fill="#d4af37" font-family="serif">786</text>

  <!-- Sun with 14 rays -->
  <circle cx="500" cy="300" r="70" fill="none" stroke="#d4af37" stroke-width="6"/>
  <g stroke="#d4af37" stroke-width="6">
    <line x1="500" y1="180" x2="500" y2="230"/>
    <line x1="500" y1="370" x2="500" y2="420"/>
    <line x1="430" y1="300" x2="380" y2="300"/>
    <line x1="570" y1="300" x2="620" y2="300"/>
    <line x1="450" y1="240" x2="410" y2="200"/>
    <line x1="550" y1="240" x2="590" y2="200"/>
    <line x1="450" y1="360" x2="410" y2="400"/>
    <line x1="550" y1="360" x2="590" y2="400"/>
    <!-- extra rays -->
    <line x1="470" y1="190" x2="490" y2="240"/>
    <line x1="530" y1="190" x2="510" y2="240"/>
    <line x1="470" y1="410" x2="490" y2="360"/>
    <line x1="530" y1="410" x2="510" y2="360"/>
    <line x1="380" y1="260" x2="440" y2="280"/>
    <line x1="620" y1="260" x2="560" y2="280"/>
  </g>

  <!-- Rice stalk with 14 grains -->
  <g fill="#d4af37">
    <rect x="495" y="500" width="10" height="220"/>
    <circle cx="500" cy="510" r="10"/>
    <circle cx="500" cy="540" r="10"/>
    <circle cx="500" cy="570" r="10"/>
    <circle cx="500" cy="600" r="10"/>
    <circle cx="500" cy="630" r="10"/>
    <circle cx="500" cy="660" r="10"/>
    <circle cx="500" cy="690" r="10"/>
    <circle cx="500" cy="720" r="10"/>
    <circle cx="480" cy="530" r="10"/>
    <circle cx="520" cy="530" r="10"/>
    <circle cx="480" cy="570" r="10"/>
    <circle cx="520" cy="570" r="10"/>
    <circle cx="480" cy="610" r="10"/>
    <circle cx="520" cy="610" r="10"/>
  </g>

  <!-- ZAVISH text -->
  <text x="500" y="880" font-size="140" text-anchor="middle" fill="#d4af37" font-family="serif" font-weight="bold">ZAVISH</text>
</svg>
